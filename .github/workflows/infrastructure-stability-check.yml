---
name: Infrastructure Stability

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  smoke-test:
    name: Infrastructure Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Configs
        run: |
          # generate configs
          docker compose -f ./env/compose.env-build.yml run --rm magma bash ./scripts/smoke/smoke

      - name: Verify Generated Files
        run: |
          FILES=("env/.commerce.env" "env/.docker.env" "env/compose.yml")
          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "File $file not found!"
              exit 1
            fi
          done
          echo "All config files generated"

      - name: Start Infrastructure
        run: |
          make up
          echo "Waiting for containers to be 'running'..."

          # Список сервисов из твоего compose.yml
          SERVICES=("nginx" "ssl-reverse-proxy" "php-app" "web-app" "mysql")
          SERVICES+=("mailpit" "varnish" "opensearch" "valkey" "sftp")
          SERVICES+=("rabbitmq" "phpmyadmin" "logs")

          # 24 итерации * 5 сек = 120 сек (2 минуты)
          for i in {1..24}; do
            ALL_RUNNING=true
            for svc in "${SERVICES[@]}"; do
              # Проверяем, есть ли запущенный контейнер, имя которого содержит название сервиса
              if [ -z "$(docker ps --filter "name=$svc" --filter "status=running" -q)" ]; then
                ALL_RUNNING=false
                break
              fi
            done

            if [ "$ALL_RUNNING" = true ]; then
              echo "All containers are up and running!"
              docker ps # Показать финальный список для логов
              break
            fi

            echo "Waiting for services... ($((i*5))s / 120s)"
            sleep 5

            if [ $i -eq 24 ]; then
              echo "Timeout: Containers failed to start in 2 minutes"
              docker ps -a
              exit 1
            fi
          done

      - name: HTTP Health Check
        run: |
          curl -v -k --fail --retry 10 --retry-delay 15 \
               --resolve mage-dev.localhost:443:127.0.0.1 \
               https://mage-dev.localhost/devstack/
